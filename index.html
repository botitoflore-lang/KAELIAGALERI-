<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Archive Studio</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
    --bg: #050505;
    --surface: #0f0f0f;
    --accent: #ff00aa; /* Color neón sutil */
    --border: #1a1a1a;
}

body {
    margin: 0; background: var(--bg); color: white;
    font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;
}

/* Header para celular: Todo en una línea */
nav {
    position: sticky; top: 0; background: rgba(5,5,5,0.95);
    backdrop-filter: blur(10px); z-index: 100; padding: 12px 10px;
    border-bottom: 1px solid var(--border);
}

.nav-container {
    display: flex; align-items: center; gap: 10px; max-width: 1200px; margin: 0 auto;
}

#search {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    padding: 10px; border-radius: 8px; color: white; font-size: 16px; /* Evita zoom en iPhone */
}

/* Grid Inteligente: 1 columna en cel, 2 o más en tablets/PC */
.main-content { padding: 15px; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
    gap: 20px;
}

/* Tarjetas Proporcionales */
.thumb {
    width: 100%;
    aspect-ratio: 16 / 9; /* Esto hace que siempre tengan forma de video */
    background: #000; border-radius: 12px; overflow: hidden;
    position: relative; border: 1px solid var(--border);
}

.thumb video, .thumb iframe {
    width: 100% !important; height: 100% !important;
    object-fit: cover; border: none;
}

.info h3 { font-size: 0.95rem; margin: 10px 0 5px; font-weight: 500; }
.tags { font-size: 0.75rem; color: #666; }

/* Modal que se adapta al ancho del cel */
        #modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000; align-items: center; justify-content: center; padding: 10px;
        }
        .modal-inner { width: 100%; max-width: 900px; position: relative; }
        #player { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; }
        <style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div style="letter-spacing: 2px; font-size: 0.8rem;">GLOBAL ARCHIVE</div>
            <input type="text" id="search" placeholder="Search title, tag or category...">
            <button class="btn" onclick="toggleUpload()">+ Add</button>
        </div>
    </nav>

    <div id="uploadPanel">
        <div class="upload-form">
            <input type="text" id="upUrl" placeholder="Video URL (mp4, youtube, etc)">
            <input type="text" id="upTitle" placeholder="Title">
            <input type="text" id="upCat" placeholder="Category">
            <input type="text" id="upTags" placeholder="Tags (comma separated)">
            <button class="btn" onclick="saveToFirebase()">Publicar en la Web</button>
        </div>
    </div>

    <main class="main-content" id="catalog"></main>

    <div id="modal">
        <div class="modal-inner">
            <button class="close-btn" onclick="closeModal()">✕ Close</button>
            <div id="player"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE GOOGLE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAytsEqI8uZYz8HgfaDdipEhhPmKQoxLeg",
            authDomain: "galeria-privada-kaelia.firebaseapp.com",
            projectId: "galeria-privada-kaelia",
            storageBucket: "galeria-privada-kaelia.firebasestorage.app",
            messagingSenderId: "248784254099",
            appId: "1:248784254099:web:ea3d671cccc8bc8bd58966",
            measurementId: "G-V30D7EWJ0T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- LÓGICA DE SUBIDA PÚBLICA ---
        async function saveToFirebase() {
            const url = document.getElementById('upUrl').value;
            const title = document.getElementById('upTitle').value || "Untitled";
            const cat = document.getElementById('upCat').value || "General";
            const tags = document.getElementById('upTags').value.split(',').map(t => t.trim());

            if(!url) return alert("URL requerida");

            const isDirect = url.match(/\.(mp4|webm|ogg|mov)$/i);

            await db.collection("videos").add({
                title, url, category: cat, tags,
                type: isDirect ? "direct" : "embed",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            toggleUpload();
            document.querySelectorAll('.upload-form input').forEach(i => i.value = '');
        }

        // --- RENDERIZADO EN TIEMPO REAL ---
        db.collection("videos").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const videos = snapshot.docs.map(doc => doc.data());
            render(videos);
        });

        function render(videos, filter = '') {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            const query = filter.toLowerCase();

            const filtered = videos.filter(v => 
                v.title.toLowerCase().includes(query) || 
                v.category.toLowerCase().includes(query) ||
                v.tags.some(t => t.toLowerCase().includes(query))
            );

            const categories = [...new Set(filtered.map(v => v.category))];

            categories.forEach(cat => {
                const section = document.createElement('section');
                section.innerHTML = `<div class="section-title">${cat}</div><div class="grid"></div>`;
                const grid = section.querySelector('.grid');

                filtered.filter(v => v.category === cat).forEach(vid => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="thumb">
                            ${vid.type === 'direct' ? `<video muted loop onmouseover="this.play()" onmouseout="this.pause()"><source src="${vid.url}"></video>` : `<iframe src="${vid.url}"></iframe>`}
                        </div>
                        <div class="info">
                            <h3>${vid.title}</h3>
                            <div class="tags">${vid.tags.join(' • ')}</div>
                        </div>
                    `;
                    card.onclick = () => openModal(vid);
                    grid.appendChild(card);
                });
                catalog.appendChild(section);
            });
        }

        function openModal(vid) {
            const player = document.getElementById('player');
            // playsinline es vital para que iPhone no robe el video a pantalla completa
            player.innerHTML = vid.type === 'direct' 
            ? `<video controls autoplay playsinline style="width:100%; height:100%;"><source src="${vid.url}"></video>` 
            : `<iframe src="${vid.url}" style="width:100%; height:100%;" allowfullscreen allow="autoplay"></iframe>`;
    
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Bloquea el scroll de atrás
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('player').innerHTML = '';
        }

        function toggleUpload() {
            const p = document.getElementById('uploadPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        document.getElementById('search').addEventListener('input', (e) => {
            // Re-filtrar localmente para velocidad
        });
    </script>
</body>
</html>
