<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaelia Archive ✨</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #050505; --surface: #0f0f0f; --accent: #ff00aa;
            --border: #1a1a1a; --text-dim: #666;
        }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* HEADER */
        nav { position: sticky; top: 0; background: rgba(5,5,5,0.9); backdrop-filter: blur(15px); z-index: 100; padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .nav-container { display: flex; align-items: center; gap: 15px; max-width: 1400px; margin: 0 auto; }
        
        .menu-icon { font-size: 1.5rem; cursor: pointer; user-select: none; }
        #search { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; color: white; font-size: 16px; outline: none; }

        /* SIDEBAR (BARRA LATERAL) */
        #sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--surface); z-index: 1000; transition: 0.3s;
            border-right: 1px solid var(--border); padding: 30px 20px; box-sizing: border-box;
        }
        #sidebar.open { left: 0; }
        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); 
            display: none; z-index: 999; backdrop-filter: blur(3px);
        }
        .sidebar-title { font-size: 0.7rem; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 30px; }
        .sidebar-btn { 
            width: 100%; background: #1a1a1a; color: white; border: 1px solid var(--border);
            padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; text-align: left; font-size: 0.85rem;
        }
        .sidebar-btn:hover { border-color: var(--accent); }

        /* ADMIN ELEMENTS */
        .admin-only { display: none; }
        #uploadPanel { display: none; background: #000; border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-top: 20px; }
        .upload-form { display: grid; gap: 8px; }
        .upload-form input { background: var(--surface); border: 1px solid var(--border); padding: 10px; color: white; border-radius: 5px; font-size: 0.8rem; }

        /* GRID Y CARDS */
        .main-content { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px; }
        .card { position: relative; cursor: pointer; }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .thumb video, .thumb iframe { width: 100%; height: 100%; object-fit: cover; border: none; pointer-events: none; }
        .del-btn { position: absolute; top: 8px; right: 8px; background: #ff4444; color: white; border: none; padding: 5px 8px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; }

        /* MODAL */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; overflow-y: auto; }
        .modal-content { max-width: 1000px; margin: 20px auto; width: 95%; }
        #player { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
        .grid-rec { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div class="sidebar-title">Menu Principal</div>
        <button class="sidebar-btn" onclick="toggleSidebar()">✕ Cerrar Menu</button>
        <button class="sidebar-btn" onclick="askAdminKey()">🔑 Admin Key</button>
        
        <div id="adminControls" class="admin-only">
            <div class="sidebar-title" style="margin-top: 30px; color: var(--accent);">Panel Admin Activo</div>
            <button class="sidebar-btn" onclick="toggleUploadPanel()">+ Nuevo Video</button>
            <div id="uploadPanel">
                <div class="upload-form">
                    <input type="text" id="upUrl" placeholder="Link (mp4 o embed)">
                    <input type="text" id="upTitle" placeholder="Título">
                    <input type="text" id="upTags" placeholder="Tags">
                    <button class="sidebar-btn" onclick="saveVideo()" style="background: var(--accent); border: none;">Publicar</button>
                </div>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="menu-icon" onclick="toggleSidebar()">☰</div>
            <input type="text" id="search" placeholder="Buscar contenido..." autocomplete="off">
        </div>
    </nav>

    <main class="main-content">
        <div class="grid" id="mainGrid"></div>
    </main>

    <div id="modal">
        <div class="modal-content">
            <button class="sidebar-btn" onclick="closeModal()" style="width: auto; padding: 8px 20px;">✕ Volver</button>
            <div id="player"></div>
            <div class="sidebar-title" style="margin-top: 30px;">Sugerencias</div>
            <div class="grid-rec" id="recGrid"></div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAytsEqI8uZYz8HgfaDdipEhhPmKQoxLeg",
            authDomain: "galeria-privada-kaelia.firebaseapp.com",
            projectId: "galeria-privada-kaelia",
            storageBucket: "galeria-privada-kaelia.firebasestorage.app",
            messagingSenderId: "1:248784254099:web:ea3d671cccc8bc8bd58966",
            appId: "G-V30D7EWJ0T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let allVideos = [];
        let isAdmin = false;
        const MASTER_KEY = "1234"; // CAMBIA TU CÓDIGO AQUÍ

        // --- LÓGICA DE INTERFAZ ---
        function toggleSidebar() {
            const side = document.getElementById('sidebar');
            const over = document.getElementById('overlay');
            side.classList.toggle('open');
            over.style.display = side.classList.contains('open') ? 'block' : 'none';
        }

        function askAdminKey() {
            const pass = prompt("Introduce la Admin Key:");
            if(pass === MASTER_KEY) {
                isAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                alert("Acceso concedido, Kaelia. ✨");
                render(allVideos);
            } else {
                alert("Código incorrecto.");
            }
        }

        function toggleUploadPanel() {
            const p = document.getElementById('uploadPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        // --- MANEJO DE DATOS ---
        db.collection("videos").orderBy("timestamp", "desc").onSnapshot(snap => {
            allVideos = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render(allVideos, document.getElementById('search').value);
        });

        async function saveVideo() {
            const url = document.getElementById('upUrl').value;
            const title = document.getElementById('upTitle').value || "Sin título";
            const tags = document.getElementById('upTags').value.split(',').map(t => t.trim());
            if(!url) return;
            const isDirect = url.match(/\.(mp4|webm|ogg|mov)$/i);
            await db.collection("videos").add({
                title, url, tags, type: isDirect ? "direct" : "embed",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.querySelectorAll('#uploadPanel input').forEach(i => i.value = '');
            toggleUploadPanel();
            toggleSidebar();
        }

        async function deleteVideo(id, e) {
            e.stopPropagation();
            if(confirm("¿Eliminar video definitivamente?")) {
                await db.collection("videos").doc(id).delete();
            }
        }

        // --- RENDERIZADO ---
        function render(videos, filter = '') {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';
            const query = filter.toLowerCase();

            videos.filter(v => v.title.toLowerCase().includes(query) || v.tags.some(t => t.toLowerCase().includes(query)))
            .forEach(vid => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="thumb">
                        ${vid.type === 'direct' ? `<video muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"><source src="${vid.url}"></video>` : `<iframe src="${vid.url}"></iframe>`}
                    </div>
                    ${isAdmin ? `<button class="del-btn" onclick="deleteVideo('${vid.id}', event)">BORRAR</button>` : ''}
                    <div class="info"><h3 style="font-size:0.8rem; margin:10px 0;">${vid.title}</h3></div>
                `;
                card.onclick = () => openModal(vid);
                grid.appendChild(card);
            });
        }

        function openModal(vid) {
            const player = document.getElementById('player');
            player.innerHTML = vid.type === 'direct' 
                ? `<video controls autoplay playsinline style="width:100%;height:100%"><source src="${vid.url}"></video>` 
                : `<iframe src="${vid.url}${vid.url.includes('?') ? '&' : '?'}autoplay=1" style="width:100%;height:100%" allowfullscreen allow="autoplay"></iframe>`;
            
            const recGrid = document.getElementById('recGrid');
            recGrid.innerHTML = '';
            const randoms = [...allVideos].filter(v => v.id !== vid.id).sort(() => 0.5 - Math.random()).slice(0, 4);
            randoms.forEach(r => {
                const item = document.createElement('div');
                item.className = 'card';
                item.innerHTML = `<div class="thumb">${r.type==='direct' ? `<video muted><source src="${r.url}"></video>` : `<iframe src="${r.url}"></iframe>`}</div><div class="info"><h3>${r.title}</h3></div>`;
                item.onclick = (e) => { e.stopPropagation(); openModal(r); };
                recGrid.appendChild(item);
            });

            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            window.scrollTo(0,0);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('player').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('search').addEventListener('input', e => render(allVideos, e.target.value));
    </script>
</body>
</html>
