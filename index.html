<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaelia Community ✨</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #050505; --surface: #0f0f0f; --accent: #ff00aa;
            --border: #1a1a1a; --text-dim: #666;
        }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* HEADER */
        nav { position: sticky; top: 0; background: rgba(5,5,5,0.9); backdrop-filter: blur(15px); z-index: 100; padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .nav-container { display: flex; align-items: center; gap: 15px; max-width: 1400px; margin: 0 auto; }
        .menu-icon { font-size: 1.5rem; cursor: pointer; }
        #search { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; color: white; font-size: 16px; outline: none; }

        /* SIDEBAR */
        #sidebar {
            position: fixed; top: 0; left: -300px; width: 300px; height: 100%;
            background: var(--surface); z-index: 1000; transition: 0.3s;
            border-right: 1px solid var(--border); padding: 25px; box-sizing: border-box;
            overflow-y: auto;
        }
        #sidebar.open { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 999; }

        /* PERFIL CARD */
        .profile-box { text-align: center; margin-bottom: 30px; padding: 20px; background: #000; border-radius: 15px; border: 1px solid var(--border); }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); margin-bottom: 10px; background: #222; }
        .user-name { font-weight: bold; font-size: 1.1rem; display: block; }

        /* BOTONES */
        .sidebar-btn { 
            width: 100%; background: #1a1a1a; color: white; border: 1px solid var(--border);
            padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; text-align: left; font-size: 0.8rem;
        }
        .sidebar-btn.active { border-color: var(--accent); color: var(--accent); }

        /* GRID Y CARDS */
        .main-content { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px; }
        .card { position: relative; cursor: pointer; }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .thumb video, .thumb iframe { width: 100%; height: 100%; object-fit: cover; border: none; }
        .uploader-tag { font-size: 0.65rem; color: var(--accent); margin-top: 5px; display: block; }

        /* MODAL */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; overflow-y: auto; padding: 15px; }
        #player { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
        
        /* FORMULARIOS */
        input.full { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div id="userProfile" class="profile-box hidden">
            <img src="" id="pfp" class="profile-img">
            <span id="userNameDisp" class="user-name">Usuario</span>
            <button class="sidebar-btn" onclick="editProfile()" style="text-align:center; margin-top:10px; font-size:0.6rem;">Editar Foto (URL)</button>
            <button class="sidebar-btn" onclick="logout()" style="text-align:center; color:#ff4444;">Cerrar Sesión</button>
        </div>

        <div id="authBox">
            <p style="font-size:0.8rem; color:var(--text-dim);">ENTRAR A MI CUENTA</p>
            <input type="text" id="loginUser" class="full" placeholder="Nombre de usuario">
            <input type="password" id="loginPass" class="full" placeholder="PIN (Código)">
            <button class="sidebar-btn" style="background:var(--accent); border:none;" onclick="handleLogin()">Entrar / Crear</button>
        </div>

        <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
        
        <button class="sidebar-btn" onclick="filterByMe()">📁 Mis Videos Subidos</button>
        <button class="sidebar-btn" onclick="location.reload()">🌐 Ver Todo lo Público</button>
        
        <div id="publishBox" class="hidden">
            <p style="font-size:0.8rem; color:var(--accent);">PUBLICAR VIDEO</p>
            <input type="text" id="upUrl" class="full" placeholder="URL Video">
            <input type="text" id="upTitle" class="full" placeholder="Título">
            <button class="sidebar-btn" style="background:white; color:black;" onclick="saveVideo()">Publicar Ahora</button>
        </div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="menu-icon" onclick="toggleSidebar()">☰</div>
            <input type="text" id="search" placeholder="Buscar en la comunidad..." autocomplete="off">
        </div>
    </nav>

    <main class="main-content">
        <div class="grid" id="mainGrid"></div>
    </main>

    <div id="modal">
        <div class="modal-content" style="max-width:1000px; margin:auto;">
            <button class="sidebar-btn" onclick="closeModal()" style="width:auto;">✕ Volver</button>
            <div id="player"></div>
            <div id="recGrid" class="grid" style="margin-top:20px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAytsEqI8uZYz8HgfaDdipEhhPmKQoxLeg",
            authDomain: "galeria-privada-kaelia.firebaseapp.com",
            projectId: "galeria-privada-kaelia",
            storageBucket: "galeria-privada-kaelia.firebasestorage.app",
            messagingSenderId: "1:248784254099:web:ea3d671cccc8bc8bd58966",
            appId: "G-V30D7EWJ0T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let allVideos = [];
        let currentUser = JSON.parse(localStorage.getItem('kaelia_user')) || null;

        // --- GESTIÓN DE CUENTAS ---
        async function handleLogin() {
            const user = document.getElementById('loginUser').value.toLowerCase().trim();
            const pass = document.getElementById('loginPass').value;
            if(!user || !pass) return alert("Rellena los campos");

            const userRef = db.collection("users").doc(user);
            const doc = await userRef.get();

            if(doc.exists) {
                if(doc.data().pass === pass) {
                    loginSuccess(doc.data());
                } else {
                    alert("PIN incorrecto");
                }
            } else {
                // Crear cuenta nueva automáticamente
                const newUser = { user, pass, pfp: 'https://cdn-icons-png.flaticon.com/512/149/149071.png' };
                await userRef.set(newUser);
                loginSuccess(newUser);
                alert("Cuenta creada!");
            }
        }

        function loginSuccess(userData) {
            currentUser = userData;
            localStorage.setItem('kaelia_user', JSON.stringify(userData));
            updateUI();
        }

        function logout() {
            localStorage.removeItem('kaelia_user');
            location.reload();
        }

        async function editProfile() {
            const newPfp = prompt("Pega la URL de tu nueva foto:");
            if(newPfp) {
                await db.collection("users").doc(currentUser.user).update({ pfp: newPfp });
                currentUser.pfp = newPfp;
                localStorage.setItem('kaelia_user', JSON.stringify(currentUser));
                updateUI();
            }
        }

        function updateUI() {
            if(currentUser) {
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('publishBox').classList.remove('hidden');
                document.getElementById('userNameDisp').innerText = currentUser.user;
                document.getElementById('pfp').src = currentUser.pfp;
            }
        }

        // --- VIDEOS ---
        db.collection("videos").orderBy("timestamp", "desc").onSnapshot(snap => {
            allVideos = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render(allVideos);
        });

        async function saveVideo() {
            const url = document.getElementById('upUrl').value;
            const title = document.getElementById('upTitle').value || "Sin título";
            if(!url || !currentUser) return;

            await db.collection("videos").add({
                title, url, 
                uploader: currentUser.user,
                pfp: currentUser.pfp,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Video publicado!");
            toggleSidebar();
        }

        function render(videos) {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';
            videos.forEach(vid => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="thumb">
                        ${vid.url.includes('mp4') ? `<video muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"><source src="${vid.url}"></video>` : `<iframe src="${vid.url}"></iframe>`}
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
                        <img src="${vid.pfp}" style="width:25px; height:25px; border-radius:50%; object-fit:cover;">
                        <div>
                            <h3 style="font-size:0.8rem; margin:0;">${vid.title}</h3>
                            <span class="uploader-tag">por ${vid.uploader}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openModal(vid);
                grid.appendChild(card);
            });
        }

        function filterByMe() {
            if(!currentUser) return alert("Inicia sesión primero");
            const myVideos = allVideos.filter(v => v.uploader === currentUser.user);
            render(myVideos);
            toggleSidebar();
        }

        // --- NAVEGACIÓN ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            const isOpen = document.getElementById('sidebar').classList.contains('open');
            document.getElementById('overlay').style.display = isOpen ? 'block' : 'none';
        }

        function openModal(vid) {
            const player = document.getElementById('player');
            player.innerHTML = vid.url.includes('mp4') 
                ? `<video controls autoplay style="width:100%;height:100%"><source src="${vid.url}"></video>` 
                : `<iframe src="${vid.url}" style="width:100%;height:100%" allowfullscreen></iframe>`;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('player').innerHTML = '';
        }

        updateUI(); // Chequear login al cargar
    </script>
</body>
</html>
