<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaelia Archive✨</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #050505; --surface: #0f0f0f; --accent: #ff00aa;
            --border: #1a1a1a; --text-dim: #666;
        }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* HEADER */
        nav { position: sticky; top: 0; background: rgba(5,5,5,0.9); backdrop-filter: blur(15px); z-index: 100; padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .nav-container { display: flex; align-items: center; gap: 15px; max-width: 1400px; margin: 0 auto; }
        .menu-icon { font-size: 1.5rem; cursor: pointer; }
        #search { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; color: white; font-size: 16px; outline: none; }

        /* SIDEBAR */
        #sidebar {
            position: fixed; top: 0; left: -300px; width: 300px; height: 100%;
            background: var(--surface); z-index: 1000; transition: 0.3s;
            border-right: 1px solid var(--border); padding: 25px; box-sizing: border-box;
            overflow-y: auto;
        }
        #sidebar.open { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 999; }

        /* PERFIL */
        .profile-box { text-align: center; margin-bottom: 20px; padding: 20px; background: #000; border-radius: 15px; border: 1px solid var(--border); }
        .profile-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); background: #222; }
        
        /* BOTONES */
        .sidebar-btn { 
            width: 100%; background: #1a1a1a; color: white; border: 1px solid var(--border);
            padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; text-align: left; font-size: 0.8rem;
        }
        .sidebar-btn:hover { border-color: var(--accent); }

        /* GRID */
        .main-content { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 25px; }
        .card { position: relative; cursor: pointer; }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .thumb video, .thumb iframe { width: 100%; height: 100%; object-fit: cover; border: none; }
        
        .tag-pill { font-size: 0.65rem; background: #1a1a1a; padding: 2px 8px; border-radius: 4px; color: var(--text-dim); margin-right: 4px; }
        .del-btn { position: absolute; top: 10px; right: 10px; background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.6rem; font-weight: bold; z-index: 5; }

        /* FORMULARIOS */
        input.full, select.full { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        select.full option { background: var(--surface); color: white; }
        .hidden { display: none; }

        /* MODAL */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; overflow-y: auto; padding: 15px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <div id="userProfile" class="profile-box hidden">
            <img src="" id="pfp" class="profile-img">
            <p id="userNameDisp" style="margin: 10px 0 5px; font-weight: bold;"></p>
            <p id="adminTag" style="color: var(--accent); font-size: 0.6rem; letter-spacing: 2px; margin-bottom: 15px;" class="hidden">MODO ADMINISTRADOR</p>
            <button class="sidebar-btn" onclick="editProfile()">🖼️ Cambiar Foto</button>
            <button class="sidebar-btn" onclick="logout()">Cerrar Sesión</button>
        </div>

        <div id="authBox">
            <p style="font-size:0.7rem; color:var(--text-dim);">CUENTA COMUNITARIA</p>
            <input type="text" id="loginUser" class="full" placeholder="Usuario">
            <input type="password" id="loginPass" class="full" placeholder="PIN">
            <button class="sidebar-btn" style="background:var(--accent); border:none;" onclick="handleLogin()">Entrar / Crear</button>
        </div>

        <button class="sidebar-btn" onclick="askAdminKey()">🔑 Admin Key (Poder Total)</button>
        <button class="sidebar-btn" onclick="filterByMe()">📁 Mis Videos</button>
        <button class="sidebar-btn" onclick="render(allVideos)">🌐 Ver Todo</button>

        <div id="publishBox" class="hidden">
            <p style="font-size:0.7rem; color:var(--accent); margin-top:20px;">PUBLICAR</p>
            <input type="text" id="upUrl" class="full" placeholder="URL (.mp4 o embed)">
            <input type="text" id="upTitle" class="full" placeholder="Título">
            <input type="text" id="upTags" class="full" placeholder="Tags (ej: 4k, pov)">
            
            <select id="upVisibility" class="full">
                <option value="publico">🌐 Público (Todos lo ven)</option>
                <option value="privado">🔒 Privado (Solo tú lo ves)</option>
            </select>

            <button class="sidebar-btn" style="background:white; color:black;" onclick="saveVideo()">Subir Video</button>
        </div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="menu-icon" onclick="toggleSidebar()">☰</div>
            <input type="text" id="search" placeholder="Buscar por título o #tag..." autocomplete="off">
        </div>
    </nav>

    <main class="main-content">
        <div class="grid" id="mainGrid"></div>
    </main>

    <div id="modal">
        <div class="modal-content" style="max-width:1000px; margin:auto;">
            <button class="sidebar-btn" onclick="closeModal()" style="width:auto; margin-bottom:15px;">✕ Cerrar</button>
            <div id="player" style="width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;"></div>
            <p style="color:var(--text-dim); font-size:0.8rem; margin-top:20px;">RECOMENDADOS</p>
            <div id="recGrid" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAytsEqI8uZYz8HgfaDdipEhhPmKQoxLeg",
            authDomain: "galeria-privada-kaelia.firebaseapp.com",
            projectId: "galeria-privada-kaelia",
            storageBucket: "galeria-privada-kaelia.firebasestorage.app",
            messagingSenderId: "1:248784254099:web:ea3d671cccc8bc8bd58966",
            appId: "G-V30D7EWJ0T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let allVideos = [];
        let currentUser = JSON.parse(localStorage.getItem('kaelia_user')) || null;
        let isGlobalAdmin = localStorage.getItem('kaelia_admin') === 'true';
        const MASTER_ADMIN_KEY = "1234"; // TU CÓDIGO MAESTRO

        // --- AUTH ---
        async function handleLogin() {
            const user = document.getElementById('loginUser').value.toLowerCase().trim();
            const pass = document.getElementById('loginPass').value;
            if(!user || !pass) return alert("Rellena los datos");

            const doc = await db.collection("users").doc(user).get();
            if(doc.exists) {
                if(doc.data().pass === pass) loginSuccess(doc.data());
                else alert("PIN incorrecto");
            } else {
                const newUser = { user, pass, pfp: 'https://cdn-icons-png.flaticon.com/512/149/149071.png' };
                await db.collection("users").doc(user).set(newUser);
                loginSuccess(newUser);
            }
        }

        function loginSuccess(data) {
            currentUser = data;
            localStorage.setItem('kaelia_user', JSON.stringify(data));
            updateUI();
        }

        function askAdminKey() {
            const key = prompt("Introduce la llave maestra:");
            if(key === MASTER_ADMIN_KEY) {
                isGlobalAdmin = true;
                localStorage.setItem('kaelia_admin', 'true');
                alert("Poder de administrador activado. ✨");
                updateUI();
                render(allVideos);
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function editProfile() {
            const url = prompt("URL de la nueva foto:");
            if(url) {
                await db.collection("users").doc(currentUser.user).update({ pfp: url });
                currentUser.pfp = url;
                localStorage.setItem('kaelia_user', JSON.stringify(currentUser));
                updateUI();
            }
        }

        function updateUI() {
            if(currentUser) {
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('publishBox').classList.remove('hidden');
                document.getElementById('userNameDisp').innerText = currentUser.user;
                document.getElementById('pfp').src = currentUser.pfp;
            }
            if(isGlobalAdmin) document.getElementById('adminTag').classList.remove('hidden');
        }

        // --- VIDEOS ---
        db.collection("videos").orderBy("timestamp", "desc").onSnapshot(snap => {
            allVideos = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render(allVideos, document.getElementById('search').value);
        });

        async function saveVideo() {
            const url = document.getElementById('upUrl').value;
            const title = document.getElementById('upTitle').value || "Sin título";
            const tags = document.getElementById('upTags').value.split(',').map(t => t.trim().toLowerCase()).filter(t => t !== "");
            const visibility = document.getElementById('upVisibility').value; // NUEVO
            if(!url || !currentUser) return;

            await db.collection("videos").add({
                title, url, tags, visibility, // NUEVO: Se guarda la visibilidad
                uploader: currentUser.user, pfp: currentUser.pfp,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.querySelectorAll('#publishBox input').forEach(i => i.value = '');
            document.getElementById('upVisibility').value = 'publico'; // Resetea a público
            toggleSidebar();
        }

        async function deleteVid(id, e) {
            e.stopPropagation();
            if(confirm("¿Borrar definitivamente?")) await db.collection("videos").doc(id).delete();
        }

        function render(videos, filter = '') {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';
            const query = filter.toLowerCase();

            // MODIFICADO: Filtrado estricto por privacidad y búsqueda
            const filtered = videos.filter(v => {
                // 1. Control de Privacidad: Se muestra si es público, si eres el dueño, o si eres admin global.
                const esPublico = v.visibility !== 'privado';
                const soyElDueno = currentUser && v.uploader === currentUser.user;
                const tienePermisoVer = esPublico || soyElDueno || isGlobalAdmin;

                if (!tienePermisoVer) return false;

                // 2. Control de Búsqueda
                return v.title.toLowerCase().includes(query) || 
                       v.tags.some(t => t.includes(query)) ||
                       v.uploader.toLowerCase().includes(query);
            });

            filtered.forEach(vid => {
                const canDelete = isGlobalAdmin || (currentUser && vid.uploader === currentUser.user);
                const esPrivado = vid.visibility === 'privado'; // NUEVO indicativo visual
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="thumb">
                        ${vid.url.includes('mp4') ? `<video muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"><source src="${vid.url}"></video>` : `<iframe src="${vid.url}"></iframe>`}
                    </div>
                    ${canDelete ? `<button class="del-btn" onclick="deleteVid('${vid.id}', event)">X</button>` : ''}
                    <div style="display:flex; align-items:center; gap:10px; margin-top:12px;">
                        <img src="${vid.pfp}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">
                        <div>
                            <h3 style="font-size:0.85rem; margin:0;">
                                ${esPrivado ? '🔒 ' : ''}${vid.title}
                            </h3>
                            <div style="margin-top:4px;">
                                ${vid.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
                card.onclick = () => openModal(vid);
                grid.appendChild(card);
            });
        }

        // --- UTILIDADES ---
        function toggleSidebar() {
            const side = document.getElementById('sidebar');
            side.classList.toggle('open');
            document.getElementById('overlay').style.display = side.classList.contains('open') ? 'block' : 'none';
        }

        function openModal(vid) {
            const player = document.getElementById('player');
            player.innerHTML = vid.url.includes('mp4') 
                ? `<video controls autoplay style="width:100%;height:100%"><source src="${vid.url}"></video>` 
                : `<iframe src="${vid.url}" style="width:100%;height:100%" allowfullscreen></iframe>`;
            
            const recGrid = document.getElementById('recGrid');
            recGrid.innerHTML = '';

            // MODIFICADO: Los recomendados también respetan la privacidad
            const disponiblesParaRecomendar = allVideos.filter(v => {
                if (v.id === vid.id) return false;
                const esPublico = v.visibility !== 'privado';
                const soyElDueno = currentUser && v.uploader === currentUser.user;
                return esPublico || soyElDueno || isGlobalAdmin;
            });

            const randoms = [...disponiblesParaRecomendar].sort(() => 0.5 - Math.random()).slice(0, 4);
            randoms.forEach(r => {
                const item = document.createElement('div');
                item.className = 'card';
                item.innerHTML = `<div class="thumb">${r.url.includes('mp4') ? `<video muted><source src="${r.url}"></video>` : `<iframe src="${r.url}"></iframe>`}</div><div class="info"><h3>${r.visibility === 'privado' ? '🔒 ' : ''}${r.title}</h3></div>`;
                item.onclick = (e) => { e.stopPropagation(); openModal(r); };
                recGrid.appendChild(item);
            });
            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('player').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function filterByMe() {
            if(!currentUser) return alert("Inicia sesión");
            render(allVideos.filter(v => v.uploader === currentUser.user));
            toggleSidebar();
        }

        document.getElementById('search').addEventListener('input', e => render(allVideos, e.target.value));
        updateUI();
    </script>
</body>
</html>
