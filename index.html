<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Archive Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg: #050505; --surface: #0f0f0f; --accent: #ff00aa;
            --border: #1a1a1a; --text-dim: #666;
        }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* HEADER */
        nav { position: sticky; top: 0; background: rgba(5,5,5,0.9); backdrop-filter: blur(15px); z-index: 100; padding: 12px 15px; border-bottom: 1px solid var(--border); }
        .nav-container { display: flex; align-items: center; gap: 10px; max-width: 1400px; margin: 0 auto; }
        #search { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 10px 15px; border-radius: 10px; color: white; font-size: 16px; outline: none; }
        .btn { background: white; color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.75rem; }
        .admin-only { display: none; } /* Oculto por defecto */

        /* GRID SIMPLE (Sin secciones) */
        .main-content { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 25px; }

        .card { position: relative; cursor: pointer; transition: transform 0.2s; }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .thumb video, .thumb iframe { width: 100%; height: 100%; object-fit: cover; border: none; pointer-events: none; }
        .info h3 { font-size: 0.9rem; margin: 10px 0 5px; }
        
        /* BOTÓN BORRAR */
        .del-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; z-index: 10; }

        /* MODAL Y RECOMENDADOS */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 1000; overflow-y: auto; padding: 20px 0; }
        .modal-content { max-width: 1000px; margin: 0 auto; width: 95%; }
        #player { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
        .rec-title { margin: 40px 0 20px; font-size: 0.8rem; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
        .grid-rec { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }

        #uploadPanel { display: none; background: var(--surface); padding: 20px; border-bottom: 1px solid var(--border); }
        .upload-form { max-width: 500px; margin: 0 auto; display: grid; gap: 10px; }
        .upload-form input { background: #000; border: 1px solid var(--border); padding: 12px; color: white; border-radius: 8px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <input type="text" id="search" placeholder="Buscar..." autocomplete="off">
            <button class="btn admin-only" id="addShowBtn" onclick="toggleUpload()">+ Subir</button>
            <button class="btn" id="loginBtn" onclick="handleAuth()">Login</button>
        </div>
    </nav>

    <div id="uploadPanel">
        <div class="upload-form">
            <input type="text" id="upUrl" placeholder="Link Video">
            <input type="text" id="upTitle" placeholder="Título">
            <input type="text" id="upTags" placeholder="Tags (separadas por comas)">
            <button class="btn" onclick="saveVideo()" style="background: var(--accent); color: white;">Publicar</button>
        </div>
    </div>

    <main class="main-content">
        <div class="grid" id="mainGrid"></div>
    </main>

    <div id="modal">
        <div class="modal-content">
            <button class="btn" onclick="closeModal()" style="margin-bottom: 20px;">✕ CERRAR</button>
            <div id="player"></div>
            <div class="rec-title">Más para ver</div>
            <div class="grid-rec" id="recGrid"></div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAytsEqI8uZYz8HgfaDdipEhhPmKQoxLeg",
            authDomain: "galeria-privada-kaelia.firebaseapp.com",
            projectId: "galeria-privada-kaelia",
            storageBucket: "galeria-privada-kaelia.firebasestorage.app",
            messagingSenderId: "1:248784254099:web:ea3d671cccc8bc8bd58966",
            appId: "G-V30D7EWJ0T"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        let allVideos = [];

        // --- AUTENTICACIÓN ---
        function handleAuth() {
            if (auth.currentUser) {
                auth.signOut();
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider);
            }
        }

        auth.onAuthStateChanged(user => {
            const adminElements = document.querySelectorAll('.admin-only');
            const loginBtn = document.getElementById('loginBtn');
            if (user) {
                adminElements.forEach(el => el.style.display = 'block');
                loginBtn.innerText = 'Logout';
                console.log("Admin logueado:", user.email);
            } else {
                adminElements.forEach(el => el.style.display = 'none');
                loginBtn.innerText = 'Login Admin';
            }
            render(allVideos); // Re-render para mostrar/ocultar botones de borrar
        });

        // --- DATOS ---
        db.collection("videos").orderBy("timestamp", "desc").onSnapshot(snap => {
            allVideos = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render(allVideos, document.getElementById('search').value);
        });

        async function saveVideo() {
            const url = document.getElementById('upUrl').value;
            const title = document.getElementById('upTitle').value || "Untitled";
            const tags = document.getElementById('upTags').value.split(',').map(t => t.trim());
            if(!url) return;
            const isDirect = url.match(/\.(mp4|webm|ogg|mov)$/i);
            await db.collection("videos").add({
                title, url, tags, type: isDirect ? "direct" : "embed",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            toggleUpload();
        }

        async function deleteVideo(id, e) {
            e.stopPropagation();
            if(confirm("¿Borrar este video para siempre?")) {
                await db.collection("videos").doc(id).delete();
            }
        }

        // --- RENDER ---
        function render(videos, filter = '') {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';
            const query = filter.toLowerCase();

            videos.filter(v => v.title.toLowerCase().includes(query) || v.tags.some(t => t.toLowerCase().includes(query)))
            .forEach(vid => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="thumb">
                        ${vid.type === 'direct' ? `<video muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"><source src="${vid.url}"></video>` : `<iframe src="${vid.url}"></iframe>`}
                    </div>
                    ${auth.currentUser ? `<button class="del-btn" onclick="deleteVideo('${vid.id}', event)">Borrar</button>` : ''}
                    <div class="info"><h3>${vid.title}</h3></div>
                `;
                card.onclick = () => openModal(vid);
                grid.appendChild(card);
            });
        }

        function openModal(vid) {
            const player = document.getElementById('player');
            player.innerHTML = vid.type === 'direct' 
                ? `<video controls autoplay playsinline style="width:100%;height:100%"><source src="${vid.url}"></video>` 
                : `<iframe src="${vid.url}${vid.url.includes('?') ? '&' : '?'}autoplay=1" style="width:100%;height:100%" allowfullscreen allow="autoplay"></iframe>`;
            
            // Recomendados Aleatorios
            const recGrid = document.getElementById('recGrid');
            recGrid.innerHTML = '';
            const randoms = [...allVideos].filter(v => v.id !== vid.id).sort(() => 0.5 - Math.random()).slice(0, 4);
            
            randoms.forEach(r => {
                const item = document.createElement('div');
                item.className = 'card';
                item.innerHTML = `<div class="thumb" style="aspect-ratio:16/9">${r.type==='direct' ? `<video muted><source src="${r.url}"></video>` : `<iframe src="${r.url}"></iframe>`}</div><div class="info"><h3 style="font-size:0.7rem">${r.title}</h3></div>`;
                item.onclick = () => openModal(r);
                recGrid.appendChild(item);
            });

            document.getElementById('modal').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('player').innerHTML = '';
        }

        function toggleUpload() {
            const p = document.getElementById('uploadPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        document.getElementById('search').addEventListener('input', e => render(allVideos, e.target.value));
    </script>
</body>
</html>
