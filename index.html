<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Archive Studio </title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #050505;
            --surface: #0f0f0f;
            --accent: #ff00aa;
            --border: #1a1a1a;
            --text-dim: #666;
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* BARRA DE NAVEGACIÓN */
        nav {
            position: sticky; top: 0; background: rgba(5,5,5,0.95);
            backdrop-filter: blur(15px); z-index: 100; padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            display: flex; align-items: center; gap: 10px; 
            max-width: 1200px; margin: 0 auto;
        }

        #search {
            flex: 1; background: var(--surface); border: 1px solid var(--border);
            padding: 10px 15px; border-radius: 10px; color: white; font-size: 16px;
            outline: none; transition: border-color 0.3s;
        }
        #search:focus { border-color: var(--accent); }

        .btn-add {
            background: white; color: black; border: none; padding: 10px 18px;
            border-radius: 8px; font-weight: 600; font-size: 0.8rem;
            cursor: pointer; text-transform: uppercase;
        }

        /* PANEL DE SUBIDA */
        #uploadPanel {
            display: none; background: var(--surface); padding: 20px;
            border-bottom: 1px solid var(--border); animation: slide 0.3s ease;
        }
        @keyframes slide { from { opacity: 0; transform: translateY(-10px); } }

        .upload-form {
            max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
        }
        .upload-form input {
            background: #000; border: 1px solid var(--border); padding: 12px;
            color: white; border-radius: 8px; outline: none; font-size: 0.9rem;
        }

        /* CUADRÍCULA DE VIDEOS */
        .main-content { padding: 15px; max-width: 1400px; margin: 0 auto; }

        .section-title {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px;
            color: var(--text-dim); margin: 30px 0 15px; display: flex; align-items: center; gap: 10px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
            gap: 20px;
        }

        .card { cursor: pointer; transition: transform 0.2s; }
        .card:active { transform: scale(0.98); }

        .thumb {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border-radius: 12px; overflow: hidden; position: relative;
            border: 1px solid var(--border);
        }
        .thumb video, .thumb iframe {
            width: 100% !important; height: 100% !important;
            object-fit: cover; border: none; pointer-events: none;
        }

        .info h3 { font-size: 0.9rem; margin: 10px 0 4px; font-weight: 500; }
        .tags { font-size: 0.7rem; color: var(--text-dim); }

        /* REPRODUCTOR (MODAL) */
        #modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            z-index: 1000; align-items: center; justify-content: center; padding: 10px;
        }
        .modal-inner { width: 100%; max-width: 1000px; position: relative; }
        #player { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
        
        .close-btn {
            position: absolute; top: -50px; right: 0;
            background: none; border: none; color: white; font-size: 2rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <input type="text" id="search" placeholder="Buscar título o #tags..." autocomplete="off">
            <button class="btn-add" onclick="toggleUpload()">+ Subir</button>
        </div>
    </nav>

    <div id="uploadPanel">
        <div class="upload-form">
            <input type="text" id="upUrl" placeholder="Link del video (.mp4 o embed)">
            <input type="text" id="upTitle" placeholder="Título del video">
            <input type="text" id="upCat" placeholder="Categoría (Ej: Hentai, POV)">
            <input type="text" id="upTags" placeholder="Tags (separadas por comas)">
            <button class="btn-add" onclick="saveVideo()" style="width: 100%">Publicar</button>
        </div>
    </div>

    <main class="main-content" id="catalog"></main>

    <div id="modal">
        <div class="modal-inner">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="player"></div>
        </div>
    </div>

    <script>
        // 1. CONFIGURACIÓN DE TU FIREBASE (PON TUS DATOS AQUÍ)
        const firebaseConfig = {
            apiKey: "AQUÍ_TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. FUNCIÓN PARA GUARDAR VIDEOS
        async function saveVideo() {
            const url = document.getElementById('upUrl').value;
            const title = document.getElementById('upTitle').value || "Sin título";
            const cat = document.getElementById('upCat').value || "General";
            const tags = document.getElementById('upTags').value.split(',').map(t => t.trim());

            if (!url) return alert("¡Necesitas poner un link!");

            const isDirect = url.match(/\.(mp4|webm|ogg|mov)$/i);

            try {
                await db.collection("videos").add({
                    title, url, category: cat, tags,
                    type: isDirect ? "direct" : "embed",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                toggleUpload();
                document.querySelectorAll('.upload-form input').forEach(i => i.value = '');
            } catch (e) {
                alert("Error al guardar: " + e.message);
            }
        }

        // 3. RENDERIZAR EN TIEMPO REAL
        db.collection("videos").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const videos = snapshot.docs.map(doc => doc.data());
            render(videos, document.getElementById('search').value);
        });

        function render(videos, filter = '') {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '';
            const query = filter.toLowerCase();

            const filtered = videos.filter(v => 
                v.title.toLowerCase().includes(query) || 
                v.category.toLowerCase().includes(query) ||
                v.tags.some(t => t.toLowerCase().includes(query))
            );

            const categories = [...new Set(filtered.map(v => v.category))];

            categories.forEach(cat => {
                const section = document.createElement('section');
                section.innerHTML = `<div class="section-title">${cat}</div><div class="grid"></div>`;
                const grid = section.querySelector('.grid');

                filtered.filter(v => v.category === cat).forEach(vid => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="thumb">
                            ${vid.type === 'direct' 
                                ? `<video muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"><source src="${vid.url}"></video>` 
                                : `<iframe src="${vid.url}" allowfullscreen></iframe>`}
                        </div>
                        <div class="info">
                            <h3>${vid.title}</h3>
                            <div class="tags">${vid.tags.map(t => '#' + t).join(' ')}</div>
                        </div>
                    `;
                    card.onclick = () => openModal(vid);
                    grid.appendChild(card);
                });
                catalog.appendChild(section);
            });
        }

        // 4. FUNCIONES DEL REPRODUCTOR
        function openModal(vid) {
            const player = document.getElementById('player');
            player.innerHTML = vid.type === 'direct' 
                ? `<video controls autoplay playsinline style="width:100%; height:100%"><source src="${vid.url}"></video>` 
                : `<iframe src="${vid.url}${vid.url.includes('?') ? '&' : '?'}autoplay=1" style="width:100%; height:100%" allowfullscreen allow="autoplay"></iframe>`;
            
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('player').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function toggleUpload() {
            const p = document.getElementById('uploadPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        // Buscador reactivo
        document.getElementById('search').addEventListener('input', (e) => {
            // Se refresca solo por el onSnapshot, pero si quieres velocidad puedes filtrar localmente
        });

        // Cerrar con Escape
        document.addEventListener('keydown', e => { if(e.key === "Escape") closeModal(); });
    </script>
</body>
</html>
